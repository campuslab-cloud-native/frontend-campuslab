<div class="top-bar" *ngIf="!isLoginPage && isLoggedIn">
  <div class="top-bar-left">
    <p class="role-badge"><span class="dot"></span> {{ roleLabel }}</p>
  </div>
  <div class="top-bar-center">
    <a routerLink="/dashboard" class="pill-link">Inicio</a>
    <a routerLink="/bookings" class="pill-link">Reservas</a>
    <a *ngIf="canSeeCatalog" routerLink="/catalog" class="pill-link">Catálogo</a>
    <a *ngIf="canSeeReports" routerLink="/reports" class="pill-link">Reportes</a>
    <a *ngIf="canSeeAudit" routerLink="/audit" class="pill-link">Auditoría</a>
  </div>
  <div class="top-bar-right">
    <button class="btn-nav" (click)="logout()">Cerrar sesión</button>
  </div>
</div>

<img *ngIf="!isLoginPage" class="app-cube" src="/cube.png" alt="" aria-hidden="true" />

<div [class.container-fluid]="!isLoginPage" [class.page-content]="!isLoginPage">
  <router-outlet></router-outlet>
</div>
