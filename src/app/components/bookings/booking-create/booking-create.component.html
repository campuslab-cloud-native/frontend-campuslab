<form [formGroup]="form" (ngSubmit)="submit()" class="card p-3 mb-3">
  <h5>Nueva reserva</h5>
  <p class="text-muted small mb-2">Duración máxima: {{ maxHours }} horas.</p>
  <div class="row g-2">
    <div class="col-12 col-md-4">
      <select class="form-select" formControlName="resourceId">
        <option [ngValue]="null" disabled>Selecciona un laboratorio</option>
        @for (lab of labs(); track lab.id) {
          <option [ngValue]="lab.id">{{ lab.name }} (cupo: {{ lab.availableQuantity }})</option>
        }
      </select>
    </div>
    <div class="col-12 col-md-3">
      <input type="datetime-local" class="form-control" formControlName="startTime" />
    </div>
    <div class="col-12 col-md-3">
      <input type="datetime-local" class="form-control" formControlName="endTime" />
    </div>
    <div class="col-12 col-md-2">
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || submitting() || !!slotIssue()">
        {{ submitting() ? 'Creando...' : 'Reservar' }}
      </button>
    </div>
  </div>

  @if (slotIssue(); as issue) {
    <div class="alert alert-warning mt-2 mb-0">{{ issue.message }}</div>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger mt-2 mb-0">{{ errorMessage() }}</div>
  }
</form>
